<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- hyprdrive's own Trash (dock stacks C). Original artwork in the spirit
       of a translucent glass bin: a frosted, see-through cylinder with a
       fine perforated band, a bright rim and a soft floor shadow. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d3de" stop-opacity="0.62"/>
      <stop offset="0.14" stop-color="#f4f7fa" stop-opacity="0.50"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#e3e9ef" stop-opacity="0.30"/>
      <stop offset="0.92" stop-color="#c4ced9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#aab5c2" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8793a1" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6ebf0"/>
      <stop offset="1" stop-color="#b3bdc8"/>
    </linearGradient>
    <radialGradient id="inside" cx="0.5" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#8d98a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#48515c" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- perforation: a staggered field of small round holes -->
    <pattern id="holes" width="10" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.7" fill="#5d6977" fill-opacity="0.55"/>
      <circle cx="7.5" cy="7" r="1.7" fill="#5d6977" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="body">
      <path d="M56 70 L68 214 A60 13 0 0 0 188 214 L200 70 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="128" cy="228" rx="80" ry="12" fill="url(#shadow)"/>

  <!-- the back wall, seen through the glass -->
  <path d="M68 214 A60 13 0 0 0 188 214 A60 13 0 0 0 68 214 Z" fill="#6c7785" fill-opacity="0.25"/>

  <!-- paper inside, seen through the glass: a loose heap of crumpled sheets -->
  <g stroke="#8f9aa7" stroke-opacity="0.55" stroke-width="1.1" stroke-linejoin="round">
    <path d="M70 214 L74 184 L92 172 L110 178 L122 196 L116 218 Z" fill="#eef1f5" fill-opacity="0.55"/>
    <path d="M112 220 L118 190 L140 178 L162 186 L170 206 L160 222 Z" fill="#f6f8fa" fill-opacity="0.6"/>
    <path d="M150 216 L160 190 L180 184 L186 204 L182 218 Z" fill="#e7ebf0" fill-opacity="0.5"/>
    <path d="M82 178 L90 150 L112 142 L128 154 L124 178 L104 184 Z" fill="#f4f6f8" fill-opacity="0.5"/>
    <path d="M126 176 L132 148 L156 140 L172 156 L166 178 Z" fill="#eceff3" fill-opacity="0.5"/>
    <path d="M98 146 L106 120 L130 114 L142 130 L134 148 Z" fill="#f1f4f7" fill-opacity="0.45"/>
    <path d="M136 142 L146 116 L166 114 L174 132 L160 146 Z" fill="#e9edf1" fill-opacity="0.45"/>
    <path d="M92 196 L104 186 L110 200 M136 196 L148 188 L152 204 M100 160 L112 152 L118 166 M140 160 L152 150 L158 164" fill="none" stroke-opacity="0.35"/>
  </g>

  <!-- body: see-through glass -->
  <path d="M56 70 L68 214 A60 13 0 0 0 188 214 L200 70 Z" fill="url(#glass)"/>
  <g clip-path="url(#body)">
    <rect x="50" y="96" width="156" height="104" fill="url(#holes)"/>
    <rect x="40" y="60" width="176" height="180" fill="url(#shade)"/>
    <!-- two smooth bands that frame the perforation -->
    <rect x="40" y="86" width="176" height="6" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="40" y="203" width="176" height="5" fill="#ffffff" fill-opacity="0.35"/>
    <!-- gloss -->
    <path d="M70 80 L80 80 L90 210 L84 210 Z" fill="#ffffff" fill-opacity="0.55"/>
    <path d="M178 80 L184 80 L176 208 L172 208 Z" fill="#ffffff" fill-opacity="0.25"/>
  </g>
  <path d="M56 70 L68 214 A60 13 0 0 0 188 214 L200 70" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M56 70 L68 214 A60 13 0 0 0 188 214 L200 70" fill="none" stroke="#5d6977" stroke-opacity="0.35" stroke-width="1"/>

  <!-- rim + opening -->
  <ellipse cx="128" cy="70" rx="76" ry="15" fill="url(#rim)"/>
  <ellipse cx="128" cy="69.5" rx="68" ry="10.5" fill="url(#inside)"/>
  <path d="M60 69.5 A68 10.5 0 0 0 196 69.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.4"/>
  <ellipse cx="128" cy="70" rx="76" ry="15" fill="none" stroke="#7d8895" stroke-opacity="0.45" stroke-width="1.2"/>
  <!-- papers: crumpled balls inside, seen over the back of the rim -->
  <defs>
    <radialGradient id="paper" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#bcc5cf"/>
    </radialGradient>
  </defs>
  <g stroke="#8a95a2" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M80 74 Q76 56 90 48 Q98 38 112 44 Q126 44 126 60 Q130 74 116 78 Z" fill="url(#paper)"/>
    <path d="M90 58 L100 52 L108 62 M100 52 L104 45" fill="none" stroke-opacity="0.5"/>
    <path d="M164 78 Q156 64 166 55 Q178 47 190 57 Q198 68 190 78 Z" fill="url(#paper)"/>
    <path d="M170 63 L180 61 L186 69" fill="none" stroke-opacity="0.5"/>
    <path d="M114 78 Q106 58 118 44 Q126 30 142 31 Q160 31 164 46 Q172 62 160 78 Z" fill="url(#paper)"/>
    <path d="M124 50 L138 44 L150 52 M138 44 L140 35 M132 62 L144 58 L150 66" fill="none" stroke-opacity="0.5"/>
  </g>
  <!-- the front lip, back over the papers -->
  <path d="M52 70 A76 15 0 0 0 204 70 L196 69.5 A68 10.5 0 0 1 60 69.5 Z" fill="url(#rim)"/>
  <path d="M52 70 A76 15 0 0 0 204 70" fill="none" stroke="#7d8895" stroke-opacity="0.45" stroke-width="1.2"/>
</svg>
