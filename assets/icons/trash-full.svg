<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- hyprdrive's own Trash (dock stacks C). Original artwork in the spirit of
       a translucent bin: a slim frosted cylinder, a field of fine perforations
       that fades toward the sides as a curved surface does, a thin rim. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c1cc" stop-opacity="0.78"/>
      <stop offset="0.12" stop-color="#e9edf2" stop-opacity="0.70"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.62" stop-color="#f1f4f7" stop-opacity="0.60"/>
      <stop offset="0.88" stop-color="#d3d9e0" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#a9b3bf" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6574" stop-opacity="0.22"/>
      <stop offset="0.14" stop-color="#5a6574" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#5a6574" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a6574" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="54" y="0" width="148" height="256" fill="url(#curve)"/>
    </mask>
    <pattern id="holes" width="9" height="11" patternUnits="userSpaceOnUse">
      <rect x="2.5" y="1" width="3.2" height="7" rx="1.6" fill="#4d5866" fill-opacity="0.34"/>
    </pattern>
    <pattern id="holes2" width="9" height="11" patternUnits="userSpaceOnUse" x="4.5" y="5.5">
      <rect x="2.5" y="1" width="3.2" height="7" rx="1.6" fill="#4d5866" fill-opacity="0.34"/>
    </pattern>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7cfd8"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7684" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9aa5b2" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <path d="M54 58 L66 220 A62 11 0 0 0 190 220 L202 58 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="128" cy="230" rx="74" ry="9" fill="url(#shadow)"/>

  <!-- back wall through the glass -->
  <path d="M66 220 A62 11 0 0 1 190 220" fill="none" stroke="#7a8594" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- paper inside, seen through the glass -->
  <g stroke="#9aa4b0" stroke-opacity="0.5" stroke-width="0.9" stroke-linejoin="round" fill-opacity="0.5">
    <path d="M70 218 L78 176 L104 164 L118 188 L110 216 Z" fill="#f4f6f8"/>
    <path d="M78 176 L104 164 L96 186 Z" fill="#dfe4ea"/>
    <path d="M108 220 L116 182 L146 170 L160 196 L150 222 Z" fill="#ffffff"/>
    <path d="M116 182 L146 170 L132 192 Z" fill="#e3e8ed"/>
    <path d="M146 218 L154 180 L180 176 L188 206 L178 220 Z" fill="#eef1f4"/>
    <path d="M84 170 L94 128 L122 120 L134 150 L118 172 Z" fill="#f7f8fa"/>
    <path d="M94 128 L122 120 L110 142 Z" fill="#dde2e8"/>
    <path d="M128 168 L140 126 L170 124 L176 156 L160 172 Z" fill="#f1f3f6"/>
    <path d="M140 126 L170 124 L156 146 Z" fill="#d9dfe5"/>
    <path d="M92 124 L102 86 L130 80 L140 110 L126 126 Z" fill="#fafbfc"/>
    <path d="M132 120 L146 84 L172 88 L176 116 L160 126 Z" fill="#eef1f4"/>
  </g>

  <path d="M54 58 L66 220 A62 11 0 0 0 190 220 L202 58 Z" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <g mask="url(#fade)">
      <rect x="40" y="78" width="176" height="134" fill="url(#holes)"/>
      <rect x="40" y="78" width="176" height="134" fill="url(#holes2)"/>
    </g>
    <rect x="40" y="50" width="176" height="190" fill="url(#depth)"/>
    <path d="M70 66 L77 66 L86 214 L81 214 Z" fill="#fff" fill-opacity="0.55"/>
  </g>
  <path d="M54 58 L66 220 A62 11 0 0 0 190 220 L202 58" fill="none" stroke="#6f7a88" stroke-opacity="0.4" stroke-width="1"/>

  <!-- rim -->
  <ellipse cx="128" cy="58" rx="74" ry="11" fill="url(#rim)"/>
  <ellipse cx="128" cy="58" rx="69" ry="8" fill="url(#inside)"/>
  <ellipse cx="128" cy="58" rx="74" ry="11" fill="none" stroke="#6f7a88" stroke-opacity="0.45" stroke-width="1"/>
  <!-- crumpled sheets above the rim: faceted, as paper folds -->
  <g stroke="#8d97a4" stroke-opacity="0.55" stroke-width="1" stroke-linejoin="round">
    <path d="M76 60 L82 36 L104 26 L122 34 L126 54 L112 62 Z" fill="#ffffff"/>
    <path d="M82 36 L104 26 L100 46 Z" fill="#e6eaef"/>
    <path d="M100 46 L122 34 L126 54 Z" fill="#d3d9e0"/>
    <path d="M82 36 L100 46 L96 60 Z" fill="#f2f4f7"/>
    <path d="M114 60 L118 28 L142 14 L166 22 L172 46 L158 62 Z" fill="#ffffff"/>
    <path d="M118 28 L142 14 L138 36 Z" fill="#eceff3"/>
    <path d="M142 14 L166 22 L138 36 Z" fill="#dfe4ea"/>
    <path d="M138 36 L166 22 L172 46 Z" fill="#cfd6de"/>
    <path d="M138 36 L150 58 L172 46 Z" fill="#e4e8ed"/>
    <path d="M158 60 L166 40 L186 36 L196 52 L186 62 Z" fill="#f4f6f8"/>
    <path d="M166 40 L186 36 L178 50 Z" fill="#d8dee4"/>
  </g>
  <!-- the front of the rim over them -->
  <path d="M54 58 A74 11 0 0 0 202 58 L197 58 A69 8 0 0 1 59 58 Z" fill="url(#rim)"/>
  <path d="M54 58 A74 11 0 0 0 202 58" fill="none" stroke="#6f7a88" stroke-opacity="0.45" stroke-width="1"/>
</svg>
